<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>Adormis</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>🖍️ Adormis</h1>
  <div id="version-pill" class="version-pill">Verific versiunea…</div>

  <button id="toggle-btn">Arată / ascunde bara de unelte</button>

  <label id="name-box" hidden>
    Numele tău (public, unic)
    <input id="display-name" type="text" maxlength="24" placeholder="ex. Andrei — gol = fără nume" />
  </label>
  <button id="save-name" hidden>Salvează numele</button>
  <p id="name-status"></p>

  <p id="consent-status" class="consent-status"></p>
  <button id="revoke-consent" hidden>Retrage acordul</button>

  <label>
    Adresă server (backend)
    <input id="server-url" type="text" placeholder="http://localhost:4000" />
  </label>
  <button id="save-server">Salvează</button>
  <p id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
