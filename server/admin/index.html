<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Adormis · Moderare</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header>
    <h1>Adormis · Moderare</h1>
    <form id="login">
      <label for="token">Token de administrator</label>
      <input id="token" type="password" autocomplete="off" required>
      <button type="submit">Intră</button>
    </form>
    <nav id="tabs" hidden>
      <button data-status="reported" class="active">Raportate</button>
      <button data-status="removed">Scoase</button>
      <button id="logout" type="button">Ieși</button>
    </nav>
  </header>
  <form id="name-form" hidden>
    <strong>Dă un nume</strong> (și unul rezervat, ex. „Adormis”) —
    <input id="name-hash" placeholder="ID public (32 de caractere, din „Ale mele”)" maxlength="32" required>
    <input id="name-value" placeholder="Numele" maxlength="24" required>
    <button type="submit">Salvează numele</button>
  </form>
  <form id="pass-form" hidden>
    <strong>Resetează parola</strong> (doar dacă ești convins că e titularul contului) —
    <input id="pass-name" placeholder="Numele de utilizator" maxlength="24" required>
    <button type="submit">Generează parolă temporară</button>
  </form>
  <div id="pass-result" hidden></div>
  <p id="msg" role="status"></p>
  <main id="list"></main>
  <script src="admin.js"></script>
</body>
</html>
